name: Test and deploy Gestor de Vendas API

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-gestor-vendas-api
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw
          ./mvnw -B verify

  deploy:
    needs: verify
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22022 -t ed25519 143.95.217.22 > ~/.ssh/host.tmp
          fingerprint="$(ssh-keygen -lf ~/.ssh/host.tmp -E sha256 | awk '{print $2}')"
          test "$fingerprint" = 'SHA256:Meq3/Ju52CkzCEAgH0pSu5qVUw2lHgzR1UaHmYkSpWc'
          cat ~/.ssh/host.tmp >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy API
        run: ssh -i ~/.ssh/id_ed25519 -p 22022 -o BatchMode=yes deploy@143.95.217.22 'sudo -n /usr/local/sbin/deploy-gestor-vendas-api'