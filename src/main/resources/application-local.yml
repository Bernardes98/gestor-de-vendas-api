spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/gestor
    username: gestor
    password: gestor_local
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

app:
  security:
    cookie-secure: false