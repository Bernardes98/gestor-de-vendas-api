services:
  postgres:
    image: postgres:16-alpine
    container_name: gestor-vendas-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: gestor
      POSTGRES_USER: gestor
      POSTGRES_PASSWORD: gestor_local

    ports:
      - "5433:5432"

    volumes:
      - gestor_vendas_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestor -d gestor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gestor_vendas_postgres_data: