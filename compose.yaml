services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gestor
      POSTGRES_USER: gestor
      POSTGRES_PASSWORD: gestor_local
    ports:
      - "5432:5432"
    volumes:
      - gestor_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestor -d gestor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gestor_postgres:
